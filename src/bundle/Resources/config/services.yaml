services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@monolog.logger.ai'

    _instanceof:
        Masilia\AiAssistant\Field\FieldValueStringifierInterface:
            tags: ['masilia.ai.field_value_stringifier']

    Masilia\AiAssistant\Client\AiClientInterface:
        alias: Masilia\AiAssistant\Client\AiClient

    Masilia\AiAssistant\Repository\AiProviderRepositoryInterface:
        alias: Masilia\Bundle\AiAssistant\Repository\AiProviderRepository

    Masilia\AiAssistant\Client\Adapter\ProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\Client\Adapter\StreamingProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\Client\Adapter\TestableProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\:
        resource: '../../../lib/*'
        exclude:
            - '../../../lib/Client/Adapter/ProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/StreamingProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/TestableProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/AbstractOpenAiCompatibleAdapter.php'
            - '../../../lib/Client/AiClientInterface.php'
            - '../../../lib/Client/AiTarget.php'
            - '../../../lib/Client/ProviderId.php'
            - '../../../lib/Client/Resolved/ResolvedProvider.php'
            - '../../../lib/Field/FieldValueStringifierInterface.php'
            - '../../../lib/Repository/'
            - '../../../lib/DTO/'
            - '../../../lib/Seo/'
            - '../../../lib/FieldFormat.php'

    Masilia\AiAssistant\Client\Adapter\OpenAiAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\AnthropicAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\MistralAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\OllamaAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\MiniMaxAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\QwenAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\ProviderAdapterRegistry:
        arguments:
            $adapters: !tagged_iterator masilia.ai.provider_adapter

    Masilia\AiAssistant\Field\FieldValueStringifierRegistry:
        arguments:
            $stringifiers: !tagged_iterator masilia.ai.field_value_stringifier

    # Lib-layer SEO meta field provider: reads from the Novactive eZ SEO bundle
    # config (bundle-layer adapter) so the lib stays free of Novactive deps.
    Masilia\AiAssistant\Seo\SeoMetaFieldsProviderInterface:
        alias: 'Masilia\Bundle\AiAssistant\Seo\NovaSeoMetaFieldsProvider'

    Masilia\AiAssistant\NovaSeoPromptBuilder:
        arguments:
            $fieldsProvider: '@Masilia\AiAssistant\Seo\SeoMetaFieldsProviderInterface'

    Masilia\AiAssistant\AiPromptBuilder:
        arguments:
            $novaSeo: '@Masilia\AiAssistant\NovaSeoPromptBuilder'

    Masilia\AiAssistant\Client\RequestLoggerInterface:
        alias: 'Masilia\Bundle\AiAssistant\Service\DoctrineRequestLogger'

    Masilia\Bundle\AiAssistant\Service\DoctrineRequestLogger: ~

    Masilia\AiAssistant\Client\AiClient:
        arguments:
            $requestLogger: '@Masilia\AiAssistant\Client\RequestLoggerInterface'

    Masilia\Bundle\AiAssistant\Controller\:
        resource: '../../Controller/*'
        public: true

    Masilia\Bundle\AiAssistant\Service\:
        resource: '../../Service/*'

    Masilia\Bundle\AiAssistant\EventListener\:
        resource: '../../EventListener/*'

    Masilia\Bundle\AiAssistant\EventListener\RequestLogFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate,  method: __invoke }
            - { name: kernel.event_listener, event: kernel.exception, method: __invoke }

    Masilia\Bundle\AiAssistant\Repository\:
        resource: '../../Repository/*'

    Masilia\Bundle\AiAssistant\Seo\:
        resource: '../../Seo/*'

    Masilia\AiAssistant\Seo\FallbackSeoMetaFieldsProvider: ~
