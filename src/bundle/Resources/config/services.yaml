services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@monolog.logger.ai'

    _instanceof:
        Masilia\AiAssistant\Field\FieldValueStringifierInterface:
            tags: ['masilia.ai.field_value_stringifier']
        Masilia\AiAssistant\Agent\Orchestrator\OrchestratorTool:
            tags: ['masilia.ai.orchestrator_tool']
        Masilia\AiAssistant\Agent\Tool\ToolInterface:
            tags: ['masilia.ai.agent_tool']
        Masilia\AiAssistant\Agent\Tool\FieldValueTransformerInterface:
            tags: ['masilia.ai.field_value_transformer']


    Masilia\AiAssistant\Client\AiClientInterface:
        alias: Masilia\AiAssistant\Client\AiClient

    Masilia\AiAssistant\Repository\AiProviderRepositoryInterface:
        alias: Masilia\Bundle\AiAssistant\Repository\AiProviderRepository

    Masilia\AiAssistant\Client\Adapter\ProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\Client\Adapter\StreamingProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\Client\Adapter\TestableProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\Client\Adapter\ImageProviderAdapterInterface:
        abstract: true

    Masilia\AiAssistant\:
        resource: '../../../lib/*'
        exclude:
            - '../../../lib/Client/Adapter/ProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/StreamingProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/TestableProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/ImageProviderAdapterInterface.php'
            - '../../../lib/Client/Adapter/AbstractOpenAiAdapter.php'
            - '../../../lib/Client/AiClientInterface.php'
            - '../../../lib/Client/AiTarget.php'
            - '../../../lib/Client/ProviderId.php'
            - '../../../lib/Client/Resolved/ResolvedProvider.php'
            - '../../../lib/Client/Resolved/ResolvedImageTarget.php'
            - '../../../lib/Field/FieldValueStringifierInterface.php'
            - '../../../lib/Repository/'
            - '../../../lib/DTO/'
            - '../../../lib/Seo/'
            - '../../../lib/FieldFormat.php'

    Masilia\AiAssistant\Client\Adapter\OpenAiAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\AnthropicAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\MistralAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\OllamaAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\MiniMaxAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\QwenAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\GeminiAdapter:
        tags: [masilia.ai.provider_adapter]

    Masilia\AiAssistant\Client\Adapter\ProviderAdapterRegistry:
        arguments:
            $adapters: !tagged_iterator masilia.ai.provider_adapter

    Masilia\AiAssistant\Client\Adapter\OpenAiImageAdapter:
        tags: [masilia.ai.image_adapter]

    Masilia\AiAssistant\Client\Adapter\MiniMaxImageAdapter:
        tags: [masilia.ai.image_adapter]

    Masilia\AiAssistant\Client\Adapter\QwenImageAdapter:
        tags: [masilia.ai.image_adapter]

    Masilia\AiAssistant\Client\ImageAdapterRegistry:
        arguments:
            $adapters: !tagged_iterator masilia.ai.image_adapter

    Masilia\AiAssistant\Client\ImageGenerationClient:
        arguments:
            $requestLogger: '@Masilia\AiAssistant\Client\RequestLoggerInterface'

    Masilia\AiAssistant\Client\ImageTargetResolver: ~

    Masilia\AiAssistant\Field\FieldValueStringifierRegistry:
        arguments:
            $stringifiers: !tagged_iterator masilia.ai.field_value_stringifier

    Masilia\AiAssistant\Field\BlockFlattener:
        arguments:
            $cachePool: '@cache.app'

    Masilia\AiAssistant\Agent\Block\BlockCatalog:
        arguments:
            $cache: '@cache.app'

    Masilia\AiAssistant\Agent\Block\ContentCatalog:
        arguments:
            $cache: '@cache.app'

    Masilia\AiAssistant\Agent\Worker\PlanBuilder:
        arguments:
            $blockCatalog: '@Masilia\AiAssistant\Agent\Block\BlockCatalog'
            $contentCatalog: '@Masilia\AiAssistant\Agent\Block\ContentCatalog'

    Masilia\AiAssistant\Agent\Tool\ToolRegistry:
        arguments:
            $tools: !tagged_iterator masilia.ai.agent_tool

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformerRegistry:
        arguments:
            $transformers: !tagged_iterator masilia.ai.field_value_transformer

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\RichTextTransformer:
        arguments:
            $inputHandler: '@Ibexa\Contracts\FieldTypeRichText\RichText\InputHandlerInterface'

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\MatrixTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\ImageTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\RelationTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\RelationListTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\UrlTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\KeywordTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\MapLocationTransformer: ~

    Masilia\AiAssistant\Agent\Tool\FieldValueTransformer\NovaSeoMetasTransformer: ~

    # Lib-layer SEO meta field provider: reads from the Novactive eZ SEO bundle
    # config (bundle-layer adapter) so the lib stays free of Novactive deps.
    Masilia\AiAssistant\Seo\SeoMetaFieldsProviderInterface:
        alias: 'Masilia\Bundle\AiAssistant\Seo\NovaSeoMetaFieldsProvider'

    Masilia\AiAssistant\NovaSeoPromptBuilder:
        arguments:
            $fieldsProvider: '@Masilia\AiAssistant\Seo\SeoMetaFieldsProviderInterface'

    Masilia\AiAssistant\AiPromptBuilder:
        arguments:
            $novaSeo: '@Masilia\AiAssistant\NovaSeoPromptBuilder'

    Masilia\AiAssistant\Client\RequestLoggerInterface:
        alias: 'Masilia\Bundle\AiAssistant\Service\DoctrineRequestLogger'

    Masilia\Bundle\AiAssistant\Service\DoctrineRequestLogger: ~

    Masilia\AiAssistant\Client\AiClient:
        arguments:
            $requestLogger: '@Masilia\AiAssistant\Client\RequestLoggerInterface'

    Masilia\Bundle\AiAssistant\Controller\:
        resource: '../../Controller/*'
        public: true

    Masilia\Bundle\AiAssistant\Command\:
        resource: '../../Command/*'

    Masilia\Bundle\AiAssistant\Service\:
        resource: '../../Service/*'

    Masilia\Bundle\AiAssistant\AutomatedTranslation\Client\Ai:
        tags: [ ibexa.automated_translation.client ]

    Masilia\Bundle\AiAssistant\AutomatedTranslation\Encoder\Field\MatrixFieldEncoder:
        tags: [ ibexa.automated_translation.field_encoder ]

    Masilia\Bundle\AiAssistant\AutomatedTranslation\Encoder\Field\NovaSeoMetasFieldEncoder:
        tags: [ ibexa.automated_translation.field_encoder ]

    Masilia\Bundle\AiAssistant\EventListener\:
        resource: '../../EventListener/*'

    Masilia\Bundle\AiAssistant\EventListener\RequestLogFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate,  method: __invoke }
            - { name: kernel.event_listener, event: kernel.exception, method: __invoke }

    Masilia\Bundle\AiAssistant\EventListener\TempFileFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate,  method: __invoke }
            - { name: kernel.event_listener, event: kernel.exception, method: __invoke }

    Masilia\Bundle\AiAssistant\Repository\:
        resource: '../../Repository/*'

    Masilia\Bundle\AiAssistant\Seo\:
        resource: '../../Seo/*'

    Masilia\AiAssistant\Seo\FallbackSeoMetaFieldsProvider: ~

    # --- Agent LLM loop (wizard) ---

    Masilia\AiAssistant\Agent\Wizard\WizardStoreInterface:
        alias: 'Masilia\Bundle\AiAssistant\Wizard\SessionWizardStore'

    Masilia\Bundle\AiAssistant\Wizard\SessionWizardStore: ~

    Masilia\AiAssistant\Agent\AgentOrchestrator:
        arguments:
            $tools: !tagged_iterator masilia.ai.orchestrator_tool
